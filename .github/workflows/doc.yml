
name: Documentation

# Vérifie à chaque modification que le dossier se compile, et le met à disposition en artefact.
on:
  push:
    paths: ['doc/**', 'site/**']
  pull_request:
    paths: ['doc/**', 'site/**']
  workflow_dispatch:

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/outils-doc
      - name: "Compilation du dossier"
        run: make -B -C doc
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: doc/dossier.pdf
